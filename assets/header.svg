<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="'JetBrains Mono','SF Mono',ui-monospace,Consolas,monospace" role="img" aria-label="Ankit Kumar Patel — Systems Engineer, Distributed Telemetry">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E14"/>
      <stop offset="1" stop-color="#070B10"/>
    </linearGradient>
    <radialGradient id="glowG" cx="22%" cy="48%" r="55%">
      <stop offset="0" stop-color="#00E599" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00E599" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="80%" cy="50%" r="45%">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#111A24" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="blur18" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <clipPath id="cp0"><rect x="74" y="166" width="0" height="28"><animate attributeName="width" dur="9s" repeatCount="indefinite" keyTimes="0;0.001;0.101;0.301;0.333;1" values="0;0;192;192;0;0"/></rect></clipPath>
    <clipPath id="cp1"><rect x="74" y="166" width="0" height="28"><animate attributeName="width" dur="9s" repeatCount="indefinite" keyTimes="0;0.334;0.434;0.634;0.666;1" values="0;0;240;240;0;0"/></rect></clipPath>
    <clipPath id="cp2"><rect x="74" y="166" width="0" height="28"><animate attributeName="width" dur="9s" repeatCount="indefinite" keyTimes="0;0.667;0.767;0.967;0.999;1" values="0;0;240;240;0;0"/></rect></clipPath>
  </defs>

  <!-- background -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)" opacity="0.6"/>
  <ellipse cx="260" cy="150" rx="260" ry="180" fill="#00E599" opacity="0.10" filter="url(#blur18)"/>
  <ellipse cx="950" cy="150" rx="240" ry="170" fill="#38BDF8" opacity="0.09" filter="url(#blur18)"/>
  <rect width="1200" height="300" fill="url(#glowG)"/>
  <rect width="1200" height="300" fill="url(#glowC)"/>
  <rect x="1" y="1" width="1198" height="298" fill="none" stroke="#1B2634" stroke-width="1" rx="2"/>

  <!-- status bar -->
  <g transform="translate(58,46)">
    <circle cx="6" cy="6" r="5" fill="#00E599"/>
    <circle cx="6" cy="6" r="5" fill="none" stroke="#00E599" stroke-width="1.5">
      <animate attributeName="r" dur="1.8s" repeatCount="indefinite" values="5;13;5"/>
      <animate attributeName="opacity" dur="1.8s" repeatCount="indefinite" values="0.7;0;0.7"/>
    </circle>
    <text x="22" y="10" fill="#00E599" font-size="12" letter-spacing="2" font-weight="700">SYSTEM ONLINE</text>
    <text x="140" y="10" fill="#4A5A6E" font-size="12" letter-spacing="1">·  ankit@otel-collector : ~ · ingesting spans</text>
  </g>

  <!-- name -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 16" to="0 0" dur="0.7s" fill="freeze"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.7s" fill="freeze"/>
    <text x="56" y="128" fill="#00E599" font-size="50" font-weight="700" letter-spacing="2" filter="url(#soft)" opacity="0.5">ANKIT KUMAR PATEL</text>
    <text x="56" y="128" fill="#E6FBF4" font-size="50" font-weight="700" letter-spacing="2">ANKIT KUMAR PATEL</text>
  </g>

  <!-- typewriter subtitle -->
  <text x="56" y="186" fill="#00E599" font-size="20" font-weight="700">›</text>
  <g font-size="20" font-weight="500" fill="#9FB3C8">
    <text x="74" y="186" clip-path="url(#cp0)">Systems Engineer</text>
    <text x="74" y="186" clip-path="url(#cp1)">Distributed Backends</text>
    <text x="74" y="186" clip-path="url(#cp2)">Predictive Telemetry</text>
  </g>
  <rect y="169" width="11" height="21" fill="#00E599">
    <animate attributeName="x" dur="9s" repeatCount="indefinite" keyTimes="0;0.001;0.101;0.301;0.334;0.434;0.634;0.667;0.767;0.967;1" values="266;266;266;266;314;314;314;314;314;314;266"/>
    <animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.101;0.301;0.333;0.434;0.634;0.666;0.767;0.967;0.999;1" values="1;1;1;0;1;1;0;1;1;0;1"/>
  </rect>

  <!-- metric chips -->
  <g transform="translate(58,222)" font-size="12.5" font-weight="600">
    <g>
      <rect x="0" y="0" width="118" height="26" rx="13" fill="#0E1620" stroke="#1E2C3A"/>
      <circle cx="16" cy="13" r="4" fill="#00E599"/>
      <text x="28" y="17" fill="#C7D6E6">p99 · 146ms</text>
    </g>
    <g transform="translate(128,0)">
      <rect x="0" y="0" width="118" height="26" rx="13" fill="#0E1620" stroke="#1E2C3A"/>
      <circle cx="16" cy="13" r="4" fill="#38BDF8"/>
      <text x="28" y="17" fill="#C7D6E6">695 tx · sec</text>
    </g>
    <g transform="translate(256,0)">
      <rect x="0" y="0" width="128" height="26" rx="13" fill="#0E1620" stroke="#1E2C3A"/>
      <circle cx="16" cy="13" r="4" fill="#FBBF24"/>
      <text x="28" y="17" fill="#C7D6E6">uptime · 99.9%</text>
    </g>
  </g>

  <!-- trace waterfall panel -->
  <g>
    <rect x="712" y="44" width="436" height="214" rx="10" fill="#0B1118" stroke="#1B2634"/>
    <text x="732" y="72" fill="#7D8BA1" font-size="12.5" letter-spacing="1">trace</text>
    <text x="772" y="72" fill="#00E599" font-size="12.5" letter-spacing="0.5" font-weight="600">request.lifecycle</text>
    <text x="1128" y="72" fill="#4A5A6E" font-size="12" text-anchor="end">230ms</text>
    <line x1="732" y1="82" x2="1128" y2="82" stroke="#17222E" stroke-width="1"/>

    <!-- span rows: track + animated bar + label -->
    <!-- 1 http.server -->
    <text x="732" y="104" fill="#8EA2B6" font-size="11">http.server</text>
    <rect x="846" y="96" width="288" height="9" rx="2.5" fill="#101A24"/>
    <rect x="846" y="96" height="9" rx="2.5" fill="#00E599"><animate attributeName="width" dur="4s" repeatCount="indefinite" keyTimes="0;0.001;0.081;0.9;0.95;1" values="0;0;288;288;0;0"/></rect>

    <!-- 2 auth.verify -->
    <text x="732" y="130" fill="#8EA2B6" font-size="11">auth.verify</text>
    <rect x="846" y="122" width="288" height="9" rx="2.5" fill="#101A24"/>
    <rect x="856" y="122" height="9" rx="2.5" fill="#38BDF8"><animate attributeName="width" dur="4s" repeatCount="indefinite" keyTimes="0;0.06;0.14;0.9;0.95;1" values="0;0;44;44;0;0"/></rect>

    <!-- 3 db.query -->
    <text x="732" y="156" fill="#8EA2B6" font-size="11">db.query</text>
    <rect x="846" y="148" width="288" height="9" rx="2.5" fill="#101A24"/>
    <rect x="910" y="148" height="9" rx="2.5" fill="#FBBF24"><animate attributeName="width" dur="4s" repeatCount="indefinite" keyTimes="0;0.12;0.2;0.9;0.95;1" values="0;0;120;120;0;0"/></rect>

    <!-- 4 cache.get -->
    <text x="732" y="182" fill="#8EA2B6" font-size="11">cache.get</text>
    <rect x="846" y="174" width="288" height="9" rx="2.5" fill="#101A24"/>
    <rect x="926" y="174" height="9" rx="2.5" fill="#F472B6"><animate attributeName="width" dur="4s" repeatCount="indefinite" keyTimes="0;0.16;0.24;0.9;0.95;1" values="0;0;30;30;0;0"/></rect>

    <!-- 5 otel.export -->
    <text x="732" y="208" fill="#8EA2B6" font-size="11">otel.export</text>
    <rect x="846" y="200" width="288" height="9" rx="2.5" fill="#101A24"/>
    <rect x="1042" y="200" height="9" rx="2.5" fill="#00E599"><animate attributeName="width" dur="4s" repeatCount="indefinite" keyTimes="0;0.26;0.34;0.9;0.95;1" values="0;0;66;66;0;0"/></rect>

    <!-- 6 sse.stream -->
    <text x="732" y="234" fill="#8EA2B6" font-size="11">sse.stream</text>
    <rect x="846" y="226" width="288" height="9" rx="2.5" fill="#101A24"/>
    <rect x="1072" y="226" height="9" rx="2.5" fill="#38BDF8"><animate attributeName="width" dur="4s" repeatCount="indefinite" keyTimes="0;0.32;0.4;0.9;0.95;1" values="0;0;52;52;0;0"/></rect>

    <!-- sweep line -->
    <rect y="90" width="2" height="152" fill="#00E599" opacity="0.18"><animate attributeName="x" dur="4s" repeatCount="indefinite" keyTimes="0;0.88;1" values="846;1130;846"/></rect>
  </g>

  <!-- scanline -->
  <rect x="0" width="1200" height="2" fill="#00E599" opacity="0.05"><animate attributeName="y" dur="7s" repeatCount="indefinite" values="0;300;0"/></rect>
</svg>

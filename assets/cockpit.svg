<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" font-family="'JetBrains Mono','SF Mono',ui-monospace,Consolas,monospace" role="img" aria-label="Capability matrix">
  <defs>
    <linearGradient id="qbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0C131B"/><stop offset="1" stop-color="#090D13"/></linearGradient>
  </defs>

  <!-- Q1 · Distributed Telemetry (green) -->
  <g>
    <rect x="16" y="16" width="574" height="134" rx="12" fill="url(#qbg)" stroke="#00E599" stroke-opacity="0.28"/>
    <rect x="30" y="32" width="4" height="102" rx="2" fill="#00E599"/>
    <rect x="44" y="40" width="30" height="30" rx="7" fill="#00E599" fill-opacity="0.1" stroke="#00E599" stroke-opacity="0.5"/>
    <polyline points="50,62 56,52 62,56 69,46" fill="none" stroke="#00E599" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="88" y="52" fill="#E6FBF4" font-size="15" font-weight="700">Distributed Telemetry &amp; Prediction</text>
    <text x="88" y="68" fill="#4A5A6E" font-size="10.5" letter-spacing="1">PREDICT THE FAILURE BEFORE IT PAGES YOU</text>
    <text x="30" y="100" fill="#9FB3C8" font-size="11">Multi-horizon failure forecasting (5m · 15m · 30m) · TreeSHAP attributions</text>
    <text x="30" y="120" fill="#9FB3C8" font-size="11">Isotonic Calibration · Conformal Prediction · OpenTelemetry pipelines</text>
  </g>

  <!-- Q2 · Autonomous Agent Runtimes (cyan) -->
  <g>
    <rect x="610" y="16" width="574" height="134" rx="12" fill="url(#qbg)" stroke="#38BDF8" stroke-opacity="0.28"/>
    <rect x="624" y="32" width="4" height="102" rx="2" fill="#38BDF8"/>
    <rect x="638" y="40" width="30" height="30" rx="7" fill="#38BDF8" fill-opacity="0.1" stroke="#38BDF8" stroke-opacity="0.5"/>

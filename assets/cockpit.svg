    <path d="M643 211 A11 11 0 0 1 663 211" fill="none" stroke="#F472B6" stroke-width="1.4" stroke-opacity="0.6"/>
    <text x="682" y="206" fill="#E6FBF4" font-size="15" font-weight="700">Mission-Critical Client Systems</text>
    <text x="682" y="222" fill="#4A5A6E" font-size="10.5" letter-spacing="1">LIVE COCKPITS, ZERO LAG</text>

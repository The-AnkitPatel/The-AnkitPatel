  </g>

  <!-- Q4 · Mission-Critical Client Systems (magenta) -->
  <g>
    <rect x="610" y="170" width="574" height="134" rx="12" fill="url(#qbg)" stroke="#F472B6" stroke-opacity="0.28"/>
    <rect x="624" y="186" width="4" height="102" rx="2" fill="#F472B6"/>
    <rect x="638" y="194" width="30" height="30" rx="7" fill="#F472B6" fill-opacity="0.1" stroke="#F472B6" stroke-opacity="0.5"/>

    <text x="682" y="52" fill="#E6FBF4" font-size="15" font-weight="700">Autonomous Agent Runtimes</text>
    <text x="682" y="68" fill="#4A5A6E" font-size="10.5" letter-spacing="1">AGENTS THAT SHIP REAL CODE</text>
    <text x="624" y="100" fill="#9FB3C8" font-size="11">Terminal-native code engines · LSP + AST parsing · sandboxed CI/CD</text>
    <text x="624" y="120" fill="#9FB3C8" font-size="11">Multi-provider LLM orchestration — Anthropic · OpenAI · Gemini · Ollama</text>
  </g>

  <!-- Q3 · High-Throughput Backends (amber) -->
  <g>
    <rect x="16" y="170" width="574" height="134" rx="12" fill="url(#qbg)" stroke="#FBBF24" stroke-opacity="0.28"/>
    <rect x="30" y="186" width="4" height="102" rx="2" fill="#FBBF24"/>
    <rect x="44" y="194" width="30" height="30" rx="7" fill="#FBBF24" fill-opacity="0.1" stroke="#FBBF24" stroke-opacity="0.5"/>
    <ellipse cx="59" cy="203" rx="8" ry="3" fill="none" stroke="#FBBF24" stroke-width="1.4"/>
    <path d="M51 203 V215 A8 3 0 0 0 67 215 V203" fill="none" stroke="#FBBF24" stroke-width="1.4"/>
    <text x="88" y="206" fill="#E6FBF4" font-size="15" font-weight="700">High-Throughput Backends</text>
    <text x="88" y="222" fill="#4A5A6E" font-size="10.5" letter-spacing="1">ACID UNDER PEAK LOAD</text>
    <text x="30" y="254" fill="#9FB3C8" font-size="11">ACID seat/gatepass allocation · PostgreSQL RLS + SELECT FOR UPDATE</text>
